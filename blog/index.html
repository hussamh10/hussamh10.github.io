<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>Blog — Hussam Habib</title>
    <meta name="description" content="Writing away from the research: places, roads, and the people on them." />
    <link rel="icon" href="../res/favicon.svg" type="image/svg+xml" />
    <link rel="alternate icon" href="../res/favicon.png" sizes="32x32" />

    <style>
      /* The board's own face, so the blog and the front page read as one site. */
      @font-face {
        font-family: "Iosevka";
        src: url("../res/fonts/Iosevka-300.woff2") format("woff2");
        font-weight: 300;
        font-display: swap;
      }

      :root {
        --ink: #111;
        --desk: #f2f2f2;
        --square: 11.5rem; /* the squares stay small; the page is allowed to be empty */
        --gap: 2rem; /* room for the covers to sit where they fell */
      }

      * {
        box-sizing: border-box;
      }

      html {
        font-size: clamp(11px, 1.1666vw, 18px);
        background: var(--desk);
        -webkit-text-size-adjust: 100%;
      }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 4.5rem 1rem 3rem;
        background: var(--desk);
        color: var(--ink);
        font-family: "Iosevka", ui-monospace, SFMono-Regular, Menlo, monospace;
        font-weight: 300;
        font-size: 0.945rem;
        line-height: 1.28;
      }

      /* ── the way back ── */
      .home {
        position: absolute;
        top: 1.6rem;
        left: 1.8rem;
        color: inherit;
        text-decoration: underline;
        text-decoration-color: #999;
        text-underline-offset: 0.2em;
      }

      /* ── the posts: small squares, centred, each one its own cover ── */
      .posts {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, var(--square)));
        justify-content: center;
        gap: var(--gap);
        width: 100%;
        max-width: calc(2 * var(--square) + var(--gap));
      }
      .post {
        display: block;
        aspect-ratio: 1;
        overflow: hidden;
        box-shadow:
          0 0.07rem 0.22rem rgba(0, 0, 0, 0.22),
          0 0.22rem 0.55rem rgba(0, 0, 0, 0.12);
      }
      .post img {
        display: block;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }

      /* ── dropped on the desk rather than set in a grid ──
         Four fixed nudges. Neighbours in a column are pushed apart rather than
         together, so no cover lands on another; the stagger between them is
         what stops the four reading as a grid. Transforms move nothing in the
         layout, which is why the gap above carries the slack. */
      .post:nth-child(1) {
        transform: rotate(-5deg) translate(-0.9rem, 0.6rem);
      }
      .post:nth-child(2) {
        transform: rotate(3.5deg) translate(1.1rem, -1.6rem);
      }
      .post:nth-child(3) {
        transform: rotate(2deg) translate(0.5rem, 1.9rem);
      }
      .post:nth-child(4) {
        transform: rotate(-3deg) translate(1.7rem, -0.5rem);
      }

      @media (max-width: 700px) {
        .home {
          top: 1.2rem;
          left: 1.2rem;
        }
      }

      /* ── the same board, lit from the other side ── */
      @media (prefers-color-scheme: dark) {
        html {
          background: #121212;
        }
        :root {
          --ink: #e6e4e0;
          --desk: #121212;
        }
        .home {
          text-decoration-color: #6e6e6e;
        }
        .post {
          box-shadow: none;
        }
      }
    </style>
  </head>

  <body>
    <a class="home" href="/">← home</a>

    <nav class="posts" aria-label="Posts">
      <a class="post" href="lemon-biscuit-man.html">
        <img src="res/squares/lemon-biscuit-man.webp" alt="Lemon Biscuit Man" decoding="async" />
      </a>
      <a class="post" href="ragbrai.html">
        <img src="res/squares/ragbrai.webp" alt="RAGBRAI — a journey through Iowa" decoding="async" />
      </a>
      <a class="post" href="alpenglow.html">
        <img src="res/squares/alpenglow.webp" alt="Alpenglow" decoding="async" />
      </a>
      <a class="post" href="westwinds.html">
        <img src="res/squares/westwinds.webp" alt="Westwinds" decoding="async" />
      </a>
    </nav>
  </body>
</html>
